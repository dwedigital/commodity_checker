<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extension connected — Tariffik</title>
  <link rel="stylesheet" href="../styles/brand.css">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background-color: var(--tf-paper); background-image: radial-gradient(#d6d4c8 .7px, transparent .7px); background-size: 20px 20px; }
    .container { width: 100%; max-width: 420px; text-align: center; }
    .mark { display: inline-flex; align-items: center; gap: 10px; font: 11px var(--font-mono); color: var(--tf-muted); }
    .mark .tf-logo-mark { width: 30px; height: 30px; margin: 0; font-size: 28px; }
    .mark .ext { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 1px dashed #aeb5a2; border-radius: 5px; background: #f8faf3; font-size: 14px; color: var(--tf-ink); }
    .spinner { width: 14px; height: 14px; border: 2px solid var(--tf-line); border-top-color: var(--tf-red); border-radius: 50%; animation: spin .8s linear infinite; }
    h1 { margin-top: 22px; font: 500 30px/1.15 var(--font-heading); letter-spacing: -1.2px; }
    p { margin: 12px 0 24px; font-size: 13px; line-height: 1.8; color: var(--tf-muted); }
    .btn { width: auto; padding-inline: 22px; }
    .is-error .mark .tf-logo-mark { background: var(--tf-ink); }
    #errorMessage { color: #9a2a1c; }
  </style>
</head>
<body>
  <div class="container">
    <!-- Loading state -->
    <div id="loading">
      <div class="mark" aria-hidden="true"><span class="tf-logo-mark">↗</span><span class="spinner"></span><span class="ext">⧉</span></div>
      <h1>Connecting…</h1>
      <p>Finishing sign-in. This only takes a moment.</p>
    </div>

    <!-- Success state -->
    <div id="success" style="display: none;">
      <div class="mark" aria-hidden="true"><span class="tf-logo-mark">↗</span> ✓ <span class="ext">⧉</span></div>
      <h1>Extension connected</h1>
      <p>You’re signed in. This tab will close by itself, or you can close it now.</p>
      <a href="#" id="successLink" class="btn btn-dark">Go to Tariffik ↗</a>
    </div>

    <!-- Error state -->
    <div id="error" class="is-error" style="display: none;">
      <div class="mark" aria-hidden="true"><span class="tf-logo-mark">↗</span> ✕ <span class="ext">⧉</span></div>
      <h1>Couldn’t connect</h1>
      <p id="errorMessage">Something went wrong during sign-in. Please try again from the extension.</p>
      <a href="#" id="errorLink" class="btn btn-outline">Go to Tariffik ↗</a>
    </div>
  </div>

  <script src="callback.js" type="module"></script>
</body>
</html>
